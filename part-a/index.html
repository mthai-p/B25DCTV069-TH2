<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thư viện lớp</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <h1>📚 Thư viện lớp</h1>
    <div class="header-right">
      <span>Sách yêu thích: <strong id="fav-count">0</strong></span>
      <button id="theme-toggle" type="button">🌙 Tối</button>
    </div>
  </header>

  <main class="container">
    <section class="toolbar" aria-label="Công cụ tìm kiếm">
      <input id="search" type="search" placeholder="Tìm theo tên sách..." />
      <select id="genre-filter" aria-label="Lọc theo thể loại"></select>
    </section>

    <p id="status" class="status" aria-live="polite"></p>
    <section id="book-grid" class="grid" aria-label="Danh sách sách"></section>

    <section class="form-section">
      <h2>Thêm sách mới</h2>
      <form id="book-form" novalidate>
        <div class="field">
          <label for="title">Tên sách</label>
          <input id="title" name="title" type="text" />
          <small class="error" data-error-for="title"></small>
        </div>
        <div class="field">
          <label for="author">Tác giả</label>
          <input id="author" name="author" type="text" />
          <small class="error" data-error-for="author"></small>
        </div>
        <div class="field">
          <label for="genre">Thể loại</label>
          <select id="genre" name="genre"></select>
          <small class="error" data-error-for="genre"></small>
        </div>
        <div class="field">
          <label for="year">Năm xuất bản</label>
          <input id="year" name="year" type="number" />
          <small class="error" data-error-for="year"></small>
        </div>
        <button type="submit">Thêm sách</button>
      </form>
    </section>
  </main>

  <footer class="footer">© Thư viện lớp – Bài tập Buổi 5–7</footer>
  <script type="module" src="js/main.js"></script>
</body>
</html>
